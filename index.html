<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Beachside Property | Photo Gallery</title><style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f6f6;color:#172c37}.hero{background:linear-gradient(110deg,#082c42,#23758b);padding:46px 22px;color:white;text-align:center}.eyebrow{letter-spacing:.19em;text-transform:uppercase;font-size:12px;opacity:.8}h1{font-size:clamp(27px,5vw,48px);margin:14px 0 10px}p{line-height:1.5}.subtitle{max-width:620px;margin:0 auto;color:#dfebee}.container{max-width:1170px;margin:auto;padding:30px 17px 50px}.note{margin:0 0 24px;color:#5c6b73;font-size:14px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.photo{margin:0;border-radius:12px;overflow:hidden;background:white;box-shadow:0 3px 16px #00000014;cursor:pointer;transition:transform .2s,box-shadow .2s}.photo:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0002}.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.photo figcaption{padding:13px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}.photo small{color:#417483;font-weight:normal;white-space:nowrap}.overlay{position:fixed;inset:0;background:#05121ded;display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;padding:20px}.overlay.active{display:flex}.overlay img{max-height:80vh;max-width:min(92vw,1000px);object-fit:contain;border-radius:4px}.overlay .caption{color:white;margin-top:12px}.close,.nav{position:absolute;border:none;background:#ffffff25;color:white;cursor:pointer;padding:12px 16px;border-radius:50px;font-size:22px}.close{right:20px;top:18px}.nav.prev{left:15px}.nav.next{right:15px}.tip{padding-top:35px;font-size:13px;color:#6a7981;text-align:center}@media(max-width:800px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.gallery{grid-template-columns:1fr}.hero{padding:34px 16px}.photo img{aspect-ratio:4/3}}
</style></head><body><header class="hero"><div class="eyebrow">Property Photo Collection</div><h1>Beachside Property Gallery</h1><p class="subtitle">Rooms • Common Areas • Rooftop Terrace • Coastal Views</p></header><main class="container"><p class="note">Explore all 9 enhanced photos. Select any image to view it full size.</p><div class="gallery"><figure class="photo" onclick="show(0)" tabindex="0" role="button" aria-label="View Dining &amp; Common Area"><img src="photos/01.jpg" alt="Dining &amp; Common Area" loading="lazy"><figcaption><span>Dining &amp; Common Area</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(1)" tabindex="0" role="button" aria-label="View Kitchenette &amp; Sink"><img src="photos/02.jpg" alt="Kitchenette &amp; Sink" loading="lazy"><figcaption><span>Kitchenette &amp; Sink</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(2)" tabindex="0" role="button" aria-label="View Property Exterior"><img src="photos/03.jpg" alt="Property Exterior" loading="lazy"><figcaption><span>Property Exterior</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(3)" tabindex="0" role="button" aria-label="View Room Interior"><img src="photos/04.jpg" alt="Room Interior" loading="lazy"><figcaption><span>Room Interior</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(4)" tabindex="0" role="button" aria-label="View Stairway to Rooftop"><img src="photos/05.jpg" alt="Stairway to Rooftop" loading="lazy"><figcaption><span>Stairway to Rooftop</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(5)" tabindex="0" role="button" aria-label="View Ocean-View Rooftop"><img src="photos/06.jpg" alt="Ocean-View Rooftop" loading="lazy"><figcaption><span>Ocean-View Rooftop</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(6)" tabindex="0" role="button" aria-label="View Rooftop Terrace"><img src="photos/07.jpg" alt="Rooftop Terrace" loading="lazy"><figcaption><span>Rooftop Terrace</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(7)" tabindex="0" role="button" aria-label="View Rooftop Neighborhood View"><img src="photos/08.jpg" alt="Rooftop Neighborhood View" loading="lazy"><figcaption><span>Rooftop Neighborhood View</span><small>View photo ↗</small></figcaption></figure>
<figure class="photo" onclick="show(8)" tabindex="0" role="button" aria-label="View Beach View &amp; Lounge"><img src="photos/09.jpg" alt="Beach View &amp; Lounge" loading="lazy"><figcaption><span>Beach View &amp; Lounge</span><small>View photo ↗</small></figcaption></figure></div><p class="tip">Gallery prepared for web viewing. For Facebook, upload the photos from the “photos” folder directly.</p></main><div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><button class="close" onclick="closeModal()" aria-label="Close">×</button><button class="nav prev" onclick="move(-1)" aria-label="Previous">‹</button><img id="large" alt=""><div class="caption" id="caption"></div><button class="nav next" onclick="move(1)" aria-label="Next">›</button></div><script>
const photos=[{src:"photos/01.jpg",name:"Dining & Common Area"},{src:"photos/02.jpg",name:"Kitchenette & Sink"},{src:"photos/03.jpg",name:"Property Exterior"},{src:"photos/04.jpg",name:"Room Interior"},{src:"photos/05.jpg",name:"Stairway to Rooftop"},{src:"photos/06.jpg",name:"Ocean-View Rooftop"},{src:"photos/07.jpg",name:"Rooftop Terrace"},{src:"photos/08.jpg",name:"Rooftop Neighborhood View"},{src:"photos/09.jpg",name:"Beach View & Lounge"}];let current=0;function show(i){current=(i+photos.length)%photos.length;document.getElementById('large').src=photos[current].src;document.getElementById('large').alt=photos[current].name;document.getElementById('caption').textContent=photos[current].name+' ('+(current+1)+' of '+photos.length+')';document.getElementById('overlay').classList.add('active')}function closeModal(){document.getElementById('overlay').classList.remove('active')}function move(n){show(current+n)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(document.getElementById('overlay').classList.contains('active')){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}})
</script></body></html>
