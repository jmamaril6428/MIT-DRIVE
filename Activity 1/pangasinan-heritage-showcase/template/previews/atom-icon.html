<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atom &middot; Icon</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="preview.css">
</head>
<body class="preview-page">
<div class="preview-head">
  <p class="preview-kicker">Atom</p>
  <h1 class="preview-title">Icon</h1>
  <p class="preview-note">A 24&times;24 stroke sprite that inherits currentColor, so an icon automatically matches the text colour of whatever it sits in.</p>
</div>
<main class="preview-stack">
  <section class="preview-row">
    <span class="preview-row__label">Sizes</span>
    <div class="stage" style="--stage-w:520px;">
      <div class="spec-row" style="color:var(--color-primary)">
        <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>
        <svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>
      </div>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Set &mdash; colour follows its context</span>
    <div class="stage" style="--stage-w:640px;">
      <div class="spec-row" style="color:var(--color-text-strong);gap:var(--space-5)">
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-waves"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-landmark"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-calendar"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-users"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ticket"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-globe"/></svg>
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg>
      </div>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Adaptive &mdash; grows a step in a wide container</span>
    <div class="stage" style="--stage-w:200px;"><svg class="icon icon--adaptive" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-compass"/></svg></div>
    <div class="stage" style="--stage-w:760px;"><svg class="icon icon--adaptive" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-compass"/></svg></div>
  </section>
</main>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol>
  <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
  <symbol id="i-waves" viewBox="0 0 24 24"><path d="M2 8c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 5-2"/><path d="M2 14c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 5-2"/></symbol>
  <symbol id="i-landmark" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/><path d="M12 3l8 5H4z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17 14.5a5.5 5.5 0 0 1 3.5 5.5"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4z"/><path d="M13 6v12" stroke-dasharray="2 2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 7.9-7 9.5-4-1.6-7-5.1-7-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17" cy="6" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.7 10.8 14.8 7.2M8.7 13.2l6.1 3.6"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11z"/></symbol>
</svg>
</body>
</html>
