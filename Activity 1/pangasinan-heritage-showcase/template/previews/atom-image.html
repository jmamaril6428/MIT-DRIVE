<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atom &middot; Image / Media</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="preview.css">
</head>
<body class="preview-page">
<div class="preview-head">
  <p class="preview-kicker">Atom</p>
  <h1 class="preview-title">Image</h1>
  <p class="preview-note">Space is reserved with aspect-ratio so the layout never jumps while a photo loads on a slow mobile connection. The crop changes with the container: 4:3 narrow, 16:9 normal, 21:9 wide.</p>
</div>
<main class="preview-stack">
  <section class="preview-row">
    <span class="preview-row__label">Container 280px &mdash; 4:3 crop</span>
    <div class="stage" style="--stage-w:280px;">
      <figure class="media">
        <div class="media__frame"><img class="media__img" src="https://agents-download.skywork.ai/image/rt/adc76441d0281cf6dc851dea5cc93de6.jpg" alt="Aerial view of the Hundred Islands archipelago" loading="lazy" decoding="async" width="799" height="450"></div>
        <figcaption class="media__caption">Hundred Islands, Alaminos City</figcaption>
      </figure>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Container 520px &mdash; 16:9 crop</span>
    <div class="stage" style="--stage-w:520px;">
      <figure class="media">
        <div class="media__frame"><img class="media__img" src="https://agents-download.skywork.ai/image/rt/156687a941d627c238d12a75e0221355.jpg" alt="The white and red Cape Bolinao lighthouse" loading="lazy" decoding="async" width="1024" height="1024"></div>
        <figcaption class="media__caption">Cape Bolinao Lighthouse, Bolinao</figcaption>
      </figure>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Container 900px &mdash; 21:9 cinematic crop</span>
    <div class="stage" style="--stage-w:900px;">
      <figure class="media">
        <div class="media__frame"><img class="media__img" src="https://agents-download.skywork.ai/image/rt/86ae589b5ee94376f5f75fa2c73f5db7.jpg" alt="The Pangasinan Provincial Capitol building in Lingayen" loading="lazy" decoding="async" width="3552" height="2664"></div>
        <figcaption class="media__caption">Pangasinan Provincial Capitol, Lingayen</figcaption>
      </figure>
    </div>
  </section>
</main>
</body>
</html>
