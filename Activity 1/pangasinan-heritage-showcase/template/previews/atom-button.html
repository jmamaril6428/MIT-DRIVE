<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atom &middot; Button</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="preview.css">
</head>
<body class="preview-page">
<div class="preview-head">
  <p class="preview-kicker">Atom</p>
  <h1 class="preview-title">Button</h1>
  <p class="preview-note">Variants, sizes and states. Inside a container narrower than 26rem the buttons expand to full width and stack.</p>
</div>
<main class="preview-stack">
  <section class="preview-row">
    <span class="preview-row__label">Container 300px &mdash; buttons stretch to full width</span>
    <div class="stage" style="--stage-w:300px;">
      <div class="stage-grid">
        <button class="btn btn--primary">Plan my trip</button>
        <button class="btn btn--accent">Book a local guide</button>
        <button class="btn btn--secondary">Add to itinerary</button>
        <button class="btn btn--ghost">Share this site</button>
      </div>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Container 560px &mdash; inline, hug content</span>
    <div class="stage" style="--stage-w:560px;">
      <div class="spec-row">
        <button class="btn btn--primary">Primary</button>
        <button class="btn btn--accent">Accent</button>
        <button class="btn btn--secondary">Secondary</button>
        <button class="btn btn--ghost">Ghost</button>
        <button class="btn btn--danger">Delete</button>
      </div>
    </div>
  </section>
  <section class="preview-row">
    <span class="preview-row__label">Sizes, icon and disabled state</span>
    <div class="stage" style="--stage-w:640px;">
      <div class="spec-row">
        <button class="btn btn--primary btn--sm">Small</button>
        <button class="btn btn--primary">Medium</button>
        <button class="btn btn--primary btn--lg">Large</button>
        <button class="btn btn--secondary"><svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map-pin"/></svg>With icon</button>
        <button class="btn btn--primary" disabled>Disabled</button>
      </div>
    </div>
  </section>
</main>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
</svg>
</body>
</html>
